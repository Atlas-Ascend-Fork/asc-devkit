# 产品映射（唯一事实源，机器可读）。
#
# 用途：asc-search 筛选条件（--arch 架构号或检索标签 -> 架构号）与产品支持推导
#（文档正文 npu 标记或“产品支持情况”中文名称 -> 产品标记 -> 架构号）。
# 本文件为唯一事实源；新增产品时直接维护本文件。

schema_version: 1

# “产品支持情况”列表使用的名称 -> 产品标记；只做完整名称匹配（忽略空白和大小写）。
# A2 系列与 200I/500 A2 推理产品必须分开；不能仅凭架构号反推 A2/A3。
product_names:
  "950":
    - Ascend 950PR&950DT系列产品
    - Ascend 950PR系列产品
    - Ascend 950DT系列产品
  "A3":
    - Atlas A3系列产品
  "910b":
    - Atlas A2系列产品
  "310b":
    - Atlas 200I/500 A2推理产品
  "310p":
    - Atlas推理系列产品AI Core
    - Atlas推理系列产品Vector Core
    - Atlas推理系列产品
  "910":
    - Atlas训练系列产品

# NPU_ARCH 架构号 -> 信息表
archs:
